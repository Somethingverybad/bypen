<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бупень</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
<div class="bg" aria-hidden="true"><div class="spot olive"></div><div class="spot teal"></div><div class="spot glow"></div></div>

<!-- вход -->
<section id="login" class="screen hidden">
  <div class="login-head"><div class="brand">WYX</div><div class="sub">сеть</div></div>
  <form id="loginForm" class="card settings-card login-card" autocomplete="on">
    <input id="u" class="field" placeholder="Ник в WYX" autocomplete="username" autocapitalize="off" spellcheck="false">
    <input id="p" class="field hidden" type="password" placeholder="Пароль" autocomplete="current-password">
    <div id="loginError" class="error hidden"></div>
    <button id="loginBtn" class="primary" type="submit">Войти через WYX</button>
    <p id="loginHint" class="hint center">Бот «Бупень» пришлёт в WYX запрос на вход — подтвердите его там.</p>
  </form>
  <div id="botWait" class="card settings-card login-card wait-card hidden">
    <div class="wait-icon" aria-hidden="true">✈︎</div>
    <div class="wait-title">Подтвердите вход в WYX</div>
    <p class="hint center" id="botWaitText"></p>
    <div class="spinner" aria-hidden="true"></div>
    <button id="botCancel" class="link" type="button">Отмена</button>
  </div>
  <div id="loginLinks" class="login-links">
    <button id="noAccount" class="link accent" type="button">Нет аккаунта WYX</button>
    <button id="pwToggle" class="link" type="button">Войти паролем</button>
  </div>
  <p class="ver center" id="loginVer"></p>
</section>

<!-- главный -->
<section id="main" class="screen hidden">
  <header class="head">
    <button class="round" id="openLog" title="Журнал" aria-label="Журнал">
      <svg viewBox="0 0 46.65 64" width="15" height="21" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.44 2.5H27.49C29.57 2.5 31.31 3.19 32.69 4.58L42.06 13.95C43.45 15.34 44.15 17.08 44.15 19.16V54.56C44.15 59.19 41.83 61.5 37.21 61.5H9.44C4.81 61.5 2.5 59.19 2.5 54.56V9.44C2.5 4.81 4.81 2.5 9.44 2.5Z"/><path d="M30.26 4.24V14.65C30.26 16.96 31.42 18.12 33.74 18.12H44.15"/><path d="M12.91 33.74H33.74M12.91 45.88H30.26M12.91 21H20.5"/></svg>
    </button>
    <div class="title"><div class="brand">WYX</div><div class="sub">сеть</div></div>
    <button class="round" id="openSettings" title="Настройки" aria-label="Настройки">
      <svg viewBox="0 0 60 66.07" width="19" height="21" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M30.67 2.5H29.33C25.97 2.5 23.25 5.22 23.25 8.58V9.13C23.25 11.3 22.08 13.32 20.19 14.42L18.87 15.19C16.98 16.29 14.66 16.29 12.76 15.19L12.3 14.94C9.4 13.26 5.67 14.27 3.99 17.17L3.31 18.33C1.63 21.24 2.64 24.97 5.55 26.65L6 26.92C7.9 28.02 9.06 30.04 9.06 32.24V33.8C9.06 36 7.9 38.02 6 39.12L5.55 39.4C2.64 41.08 1.63 44.81 3.31 47.71L3.99 48.87C5.67 51.78 9.4 52.78 12.3 51.1L12.76 50.86C14.66 49.76 16.98 49.76 18.87 50.86L20.19 51.62C22.08 52.72 23.25 54.74 23.25 56.91V57.49C23.25 60.85 25.97 63.57 29.33 63.57H30.67C34.04 63.57 36.76 60.85 36.76 57.49V56.94C36.76 54.77 37.92 52.75 39.81 51.65L41.13 50.89C43.02 49.79 45.35 49.79 47.24 50.89L47.7 51.13C50.6 52.81 54.33 51.81 56.01 48.9L56.69 47.74C58.37 44.84 57.36 41.11 54.46 39.43L54 39.15C52.1 38.05 50.94 36.03 50.94 33.83V32.27C50.94 30.07 52.1 28.05 54 26.95L54.46 26.68C57.36 25 58.37 21.27 56.69 18.36L56.01 17.2C54.33 14.3 50.6 13.29 47.7 14.97L47.24 15.22C45.35 16.32 43.02 16.32 41.13 15.22L39.81 14.45C37.92 13.35 36.76 11.33 36.76 9.16V8.58C36.76 5.22 34.04 2.5 30.67 2.5Z"/><path d="M39.17 33.07C39.17 38.13 35.07 42.24 30 42.24C24.94 42.24 20.83 38.13 20.83 33.07C20.83 28 24.94 23.9 30 23.9C35.07 23.9 39.17 28 39.17 33.07Z"/></svg>
    </button>
  </header>

  <div class="center-area">
    <button id="big" class="big off" aria-label="Подключить">
      <span class="ring r1"></span><span class="ring r2"></span>
      <span class="disc"></span>
      <span class="big-content">
        <svg id="symPower" class="sym" viewBox="0 0 174 179.49" fill="none" stroke="currentColor" stroke-width="17" stroke-linecap="round"><path d="M40.34 29.36C21.02 43.66 8.5 66.61 8.5 92.49C8.5 135.84 43.65 170.99 87 170.99C130.35 170.99 165.5 135.84 165.5 92.49C165.5 66.61 152.98 43.66 133.67 29.36M87 85.9V8.5"/></svg>
        <svg id="symHalf" class="sym hidden" viewBox="0 0 181.1 217" fill="none"><defs><clipPath id="leftHalf"><rect x="0" y="0" width="90.55" height="217"/></clipPath></defs><path d="M90.55 8.5L161.21 40.41C168.8 44.21 172.6 50.29 172.6 58.64V98.53C172.6 144.87 150.19 180.2 105.37 204.51C95.49 209.83 85.61 209.83 75.74 204.51C30.91 180.2 8.5 144.87 8.5 98.53V58.64C8.5 50.29 12.3 44.21 19.9 40.41L90.55 8.5Z" fill="currentColor" fill-opacity=".75" clip-path="url(#leftHalf)"/><path d="M90.55 8.5L161.21 40.41C168.8 44.21 172.6 50.29 172.6 58.64V98.53C172.6 144.87 150.19 180.2 105.37 204.51C95.49 209.83 85.61 209.83 75.74 204.51C30.91 180.2 8.5 144.87 8.5 98.53V58.64C8.5 50.29 12.3 44.21 19.9 40.41L90.55 8.5Z" stroke="currentColor" stroke-width="17" stroke-linejoin="round"/></svg>
        <svg id="symOn" class="sym hidden" viewBox="0 0 181.1 217" fill="none"><path d="M90.55 8.5L161.21 40.41C168.8 44.21 172.6 50.29 172.6 58.64V98.53C172.6 144.87 150.19 180.2 105.37 204.51C95.49 209.83 85.61 209.83 75.74 204.51C30.91 180.2 8.5 144.87 8.5 98.53V58.64C8.5 50.29 12.3 44.21 19.9 40.41L90.55 8.5Z" fill="#2F5B53" stroke="#2F5B53" stroke-width="17" stroke-linejoin="round"/><path d="M56.36 108.79L79.15 131.58L124.74 85.99" stroke="#C7F964" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg id="symWarn" class="sym hidden" viewBox="0 0 181.1 217" fill="none"><path d="M90.55 8.5L161.21 40.41C168.8 44.21 172.6 50.29 172.6 58.64V98.53C172.6 144.87 150.19 180.2 105.37 204.51C95.49 209.83 85.61 209.83 75.74 204.51C30.91 180.2 8.5 144.87 8.5 98.53V58.64C8.5 50.29 12.3 44.21 19.9 40.41L90.55 8.5Z" stroke="#C65A52" stroke-width="17" stroke-linejoin="round"/><path d="M90.5 62V118" stroke="#C65A52" stroke-width="17" stroke-linecap="round"/><circle cx="90.5" cy="148" r="10" fill="#C65A52"/></svg>
        <span id="bigTitle" class="big-title">Подключить</span>
      </span>
    </button>
  </div>

  <div id="statusCard" class="card status-card">
    <div class="state-line"><span id="dot" class="dot idle"></span><span id="stateText">Не подключено</span></div>
    <div class="cols" id="cols"></div>
    <div id="cardError" class="error small hidden"></div>
  </div>
  <div id="updateCard" class="card settings-card update hidden"></div>
</section>

<!-- лист: настройки / журнал -->
<div id="sheetWrap" class="sheet-wrap hidden">
  <div class="sheet" id="sheet">
    <div class="grabber"></div>
    <div class="sheet-head"><button class="sheet-close" id="closeSheet" aria-label="Закрыть">✕</button><div id="sheetTitle">Настройки</div><div class="sheet-tools" id="sheetTools"></div></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
